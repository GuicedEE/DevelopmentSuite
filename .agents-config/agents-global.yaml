# Activation & Discovery
discovery:
  mode: "hybrid"
  routes:
    - type: "id_based"
      description: "Use '{id}' to reference a skill in prompts"
      example: "Use 'senior-architect' for system design"
    - type: "path_based"
      description: "Direct path to SKILL.md files"
      example: "skills/.curated/senior-architect/SKILL.md"
    - type: "category_based"
      description: "Browse by category tags"
      example: "Show all 'Architecture' skills"
    - type: "tag_based"
      description: "Search by topic tags"
      example: "Find skills tagged 'kubernetes'"

# Load Order & Fallback Rules
activation:
  rules:
    - "Identify task scope"
    - "Select relevant skills from catalog by category or tag"
    - "Load skill's SKILL.md — frontmatter triggers activation"
    - "Load references/ files only when skill instructions call for them"
  fallback: "If runtime discovery doesn't return results, open SKILL.md files directly"

# Tags Index (for quick lookup)
tags:
  cloud: ["arm-to-terraform-migration", "guicedee-cloud-app"]
  kubernetes: ["senior-devops"]
  docker: ["senior-devops"]
  terraform: ["terraform-code-generator", "terraform-doc-generator", "terraform-module-scaffold", "terraform-plan-analyzer", "terraform-project-generator", "terraform-resource-fetch", "terraform-security-scanner", "terraform-state-manager", "terraform-validator"]
  security: ["security-best-practices", "security-compliance", "security-ownership-map", "guicedee-auth", "guicedee-jwt"]
  testing: ["playwright", "screenshot", "test-driven-development", "senior-qa", "code-reviewer"]
  git: ["git-commit-helper", "git-commit-signing", "finishing-a-development-branch", "changelog-generator", "using-git-worktrees"]
  architecture: ["senior-architect", "senior-backend", "senior-devops", "information-architect"]
  jwebmp: ["jwebmp-core", "jwebmp-client", "jwebmp-angular", "jwebmp-aggrid", "jwebmp-agcharts", "jwebmp-bootstrap"]
  guicedee: ["guicedee-auth", "guicedee-cdi", "guicedee-rest", "guicedee-vertx", "guicedee-persistence"]
  activitymaster: ["activitymaster", "entityassist"]

