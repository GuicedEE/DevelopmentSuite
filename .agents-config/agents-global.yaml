# Global Agent Configuration for AIRules Enterprise Skills
# Location: ~/.agents/agents-global.yaml
#
# This file aggregates all available agents and skills from the AIRules repository
# and configures them for use across all AI development tools (GitHub Copilot, Claude, etc.)
#
# Last updated: 2026-06-08
# Version: 1.0

version: "1.0"
repository: "https://github.com/GuicedEE/ai-rules"
description: "Enterprise-wide AI skills catalog and agent registry"

# Global Configuration
global:
  skills_root: "${AIRULES_HOME}/skills"
  cache_enabled: true
  discovery_enabled: true
  auto_reload: true
  catalogs:
    - id: "curated"
      name: "Curated Skills"
      path: "${AIRULES_HOME}/skills/.curated"
      description: "General-purpose, community-quality skills suitable for any project"
      count: 39+
      public: true
    - id: "system"
      name: "System Skills"
      path: "${AIRULES_HOME}/skills/.system"
      description: "Project-specific skills for GuicedEE, JWebMP, and ActivityMaster ecosystems"
      count: 70+
      public: true

# Environment Setup
environment:
  AIRULES_HOME: "${AIRULES_HOME:-/home/gedmarc/java/devsuite/AIRules}"
  GUICEDEE_HOME: "${GUICEDEE_HOME:-/home/gedmarc/java/devsuite/GuicedEE}"
  JWEBMP_HOME: "${JWEBMP_HOME:-/home/gedmarc/java/devsuite/JWebMP}"
  ACTIVITYMASTER_HOME: "${ACTIVITYMASTER_HOME:-/home/gedmarc/java/devsuite/ActivityMaster}"

